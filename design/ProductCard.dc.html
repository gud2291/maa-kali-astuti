<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Manrope:wght@400;500;600;700&family=Mukta:wght@400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap">
<script src="mka-core.js"></script>
</helmet>
<sc-if value="{{ isRow }}" hint-placeholder-val="{{ false }}">
  <article style="display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;background-color:#FFFDF8;border:1px solid #EAE0CA;border-radius:4px">
    <a href="{{ p.href }}" style="display:block;width:88px;aspect-ratio:4/5;background-color:#F4EDDD;border-radius:3px;overflow:hidden"><span ref="{{ imgRef }}" style="display:block;width:100%;height:100%">{{ img }}</span></a>
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <span style="font:600 10.5px/1.2 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A5C1C">{{ p.catShort }}</span>
      <a href="{{ p.href }}" style="font:400 17px/1.25 Fraunces,'Tiro Devanagari Hindi',serif;color:#0E3B30;text-decoration:none">{{ p.title }}</a>
      <div style="display:flex;align-items:baseline;gap:8px;font:500 13px/1 Manrope,sans-serif;font-variant-numeric:tabular-nums"><span style="font-weight:700;font-size:15px;color:#1F2A24">{{ p.priceS }}</span><span style="color:#5B6A61;text-decoration:line-through">{{ p.mrpS }}</span><span style="color:#A8322D;font-weight:600">{{ p.offS }}</span></div>
    </div>
    <button onClick="{{ add }}" aria-label="{{ addAria }}" style="width:40px;height:40px;border-radius:999px;border:1px solid #164E3F;background-color:#FBF7EE;color:#164E3F;display:grid;place-items:center;cursor:pointer;transition:background-color 150ms" style-hover="background-color:#E4EEE8"><span style="width:18px;height:18px;display:block">{{ rowIcon }}</span></button>
  </article>
</sc-if>
<sc-if value="{{ isCard }}" hint-placeholder-val="{{ true }}">
  <article onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative;display:flex;flex-direction:column;gap:14px;height:100%">
    <div style="position:relative;border-radius:4px;transition:transform 300ms cubic-bezier(.22,1,.36,1),box-shadow 300ms cubic-bezier(.22,1,.36,1);transform:{{ lift }};box-shadow:{{ shadow }}">
      <a href="{{ p.href }}" aria-label="{{ p.name }}" style="position:relative;display:block;aspect-ratio:4/5;background-color:#F4EDDD;border-radius:4px;overflow:hidden">
        <span ref="{{ imgRef }}" style="position:absolute;inset:0;display:block;filter:{{ oosFilter }}">{{ img }}</span>
        <span style="position:absolute;inset:0;display:block;background-color:#EFE6D2;opacity:{{ img2op }};transition:opacity 450ms cubic-bezier(.22,1,.36,1)">{{ img2 }}</span>
        <span style="position:absolute;inset:0;border-radius:4px;box-shadow:{{ ring }};transition:box-shadow 300ms;pointer-events:none"></span>
      </a>
      <div style="position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none">
        <sc-for list="{{ badges }}" as="b" hint-placeholder-count="1">
          <span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font:700 10px/1 Manrope,Mukta,sans-serif;letter-spacing:.08em;text-transform:uppercase;background-color:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.ring }}">{{ b.t }}</span>
        </sc-for>
      </div>
      <button onClick="{{ wish }}" aria-label="{{ wishAria }}" aria-pressed="{{ wished }}" style="position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:999px;border:0;background-color:rgba(251,247,238,.92);color:{{ heartColor }};display:grid;place-items:center;cursor:pointer;transition:color 150ms" style-hover="color:#A8322D"><span ref="{{ heartRef }}" style="width:18px;height:18px;display:block">{{ heartIcon }}</span></button>
      <sc-if value="{{ showBar }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;transform:{{ barY }};opacity:{{ barOp }};transition:transform 300ms cubic-bezier(.22,1,.36,1),opacity 300ms;pointer-events:{{ barPe }}">
          <sc-if value="{{ hasSizes }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;gap:6px;padding:6px;background-color:rgba(251,247,238,.96);border-radius:4px;box-shadow:inset 0 0 0 1px #EAE0CA">
              <span style="font:600 11px/1 Manrope,sans-serif;color:#5B6A61;padding-left:4px;flex:1">{{ t.size }}</span>
              <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="3"><button onClick="{{ s.pick }}" style="width:34px;height:30px;border-radius:3px;border:1px solid #EAE0CA;background-color:#FFFDF8;font:700 12px/1 Manrope,sans-serif;color:#164E3F;cursor:pointer;transition:border-color 150ms,background-color 150ms" style-hover="border-color:#164E3F;background-color:#E4EEE8">{{ s.k }}</button></sc-for>
            </div>
          </sc-if>
          <button onClick="{{ add }}" disabled="{{ addDisabled }}" style="height:44px;border:0;border-radius:4px;background-color:#164E3F;background-image:linear-gradient(110deg,rgba(217,185,106,0) 40%,rgba(217,185,106,.4) 50%,rgba(217,185,106,0) 60%);background-size:260% 100%;background-position:100% 0;background-repeat:no-repeat;color:#FBF7EE;font:600 13.5px/1 Manrope,Mukta,sans-serif;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(217,185,106,.5);transition:background-position 700ms cubic-bezier(.22,1,.36,1)" style-hover="background-position:0 0"><span style="width:17px;height:17px;display:block">{{ addIcon }}</span><span>{{ addLabel }}</span></button>
        </div>
      </sc-if>
      <sc-if value="{{ showPlus }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ addMob }}" aria-label="{{ addAria }}" style="position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:999px;border:0;background-color:#164E3F;color:#FBF7EE;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(217,185,106,.55),0 8px 18px -8px rgba(14,59,48,.6);cursor:pointer"><span style="width:18px;height:18px;display:block">{{ plusIcon }}</span></button>
      </sc-if>
    </div>
    <div style="display:flex;flex-direction:column;gap:7px;padding:0 2px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font:600 10.5px/1.2 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A5C1C">{{ p.catShort }}</span>
        <span style="display:inline-flex;align-items:center;gap:4px;font:600 12px/1 Manrope,sans-serif;color:#1F2A24;font-variant-numeric:tabular-nums"><span style="width:12px;height:12px;display:block;color:#B8923A">{{ starIcon }}</span>{{ p.ratingS }}<span style="font-weight:500;color:#5B6A61">{{ p.reviewsS }}</span></span>
      </div>
      <a href="{{ p.href }}" style="font:400 {{ titleSize }}/1.25 Fraunces,'Tiro Devanagari Hindi',serif;font-variation-settings:'SOFT' 40;color:#0E3B30;text-decoration:none;max-height:2.5em;overflow:hidden;min-height:2.5em">{{ p.title }}</a>
      <span style="align-self:flex-start;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background-color:#E4EEE8;color:#164E3F;font:500 11.5px/1 Manrope,Mukta,sans-serif;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">{{ p.intentS }}</span>
      <div style="display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;row-gap:2px;font:500 13px/1.2 Manrope,sans-serif;font-variant-numeric:tabular-nums">
        <span style="font-weight:700;font-size:16px;color:#1F2A24">{{ p.priceS }}</span>
        <span style="color:#5B6A61;text-decoration:line-through">{{ p.mrpS }}</span>
        <span style="color:#A8322D;font-weight:600">{{ p.offS }}</span>
      </div>
      <sc-if value="{{ hasStock }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 Manrope,Mukta,sans-serif;color:#A8322D"><span style="width:6px;height:6px;border-radius:999px;background-color:#A8322D;display:block"></span>{{ stockNote }}</span></sc-if>
      <sc-if value="{{ isWish }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:8px;margin-top:4px">
          <button onClick="{{ moveToCart }}" style="flex:1;height:42px;border:0;border-radius:4px;background-color:#164E3F;color:#FBF7EE;font:600 13px/1 Manrope,sans-serif;letter-spacing:.03em;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(217,185,106,.5)" style-hover="background-color:#1C6B54">{{ t.move }}</button>
          <button onClick="{{ removeWish }}" aria-label="Remove from wishlist" style="width:42px;height:42px;border-radius:4px;border:1px solid #EAE0CA;background-color:#FFFDF8;color:#5B6A61;display:grid;place-items:center;cursor:pointer" style-hover="border-color:#A8322D;color:#A8322D"><span style="width:17px;height:17px;display:block">{{ trashIcon }}</span></button>
        </div>
      </sc-if>
    </div>
  </article>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:520},&quot;pid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;b-pyrite&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;std&quot;,&quot;compact&quot;,&quot;row&quot;],&quot;default&quot;:&quot;std&quot;,&quot;tsType&quot;:&quot;'std'|'compact'|'row'&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shop&quot;,&quot;wish&quot;],&quot;default&quot;:&quot;shop&quot;,&quot;tsType&quot;:&quot;'shop'|'wish'&quot;}}">
class Component extends DCLogic {
  state = { h: false, ph: 'idle', vw: window.innerWidth, ready: false };
  uid = Math.random().toString(36).slice(2, 7);
  componentDidMount() {
    const go = () => { this.un = MKA.bind(this); this.setState({ ready: true }); };
    if (window.MKA && MKA.ready) go(); else this._w = setInterval(() => { if (window.MKA && MKA.ready) { clearInterval(this._w); go(); } }, 30);
  }
  componentWillUnmount() { this.un && this.un(); clearInterval(this._w); clearTimeout(this._t1); clearTimeout(this._t2); }
  doAdd(v) {
    const M = MKA, p = M.byId[this.props.pid];
    if (!p || p.stock === 0 || this.state.ph !== 'idle') return;
    this.setState({ ph: 'loading' });
    this._t1 = setTimeout(() => {
      M.store.add(p.id, { v });
      M.fx.fly(this.imgEl);
      M.ui.toast(`${p.name}${v ? ' · size ' + v : ''} added to cart`, { tone: 'ok', action: 'View cart', act: 'cart' });
      if (M.store.count() === 1) M.ui.emit('cart');
      this.setState({ ph: 'added' });
      this._t2 = setTimeout(() => this.setState({ ph: 'idle' }), 1500);
    }, 380);
  }
  renderVals() {
    const M = window.MKA;
    if (!M || !this.state.ready) return { isCard: true, isRow: false, p: {}, badges: [], sizes: [], t: {} };
    const p = M.byId[this.props.pid] || M.P[0];
    const hi = M.lang() === 'hi', ic = M.ic(React), mob = this.state.vw < 768;
    const size = this.props.size || 'std', mode = this.props.mode || 'shop';
    const h = this.state.h && !mob, wished = M.store.isWish(p.id), ph = this.state.ph, oos = p.stock === 0;
    const badges = (p.badges || []).slice(0, 2).map((k) => { const b = M.BADGE[k]; return { t: hi ? b[1] : b[0], bg: b[2], fg: b[3], ring: b[2] === '#FBF7EE' ? 'inset 0 0 0 1px rgba(184,146,58,.55)' : 'none' }; });
    if (oos) badges.unshift({ t: hi ? 'स्टॉक ख़त्म' : 'Sold out', bg: '#5B6A61', fg: '#FBF7EE', ring: 'none' });
    const T = hi ? { size: 'कलाई का साइज़', add: 'कार्ट में जोड़ें', adding: 'जोड़ रहे हैं…', added: 'जुड़ गया', notify: 'उपलब्ध होने पर बताएँ', move: 'कार्ट में ले जाएँ', off: '% छूट' } : { size: 'Wrist size', add: 'Add to cart', adding: 'Adding…', added: 'Added', notify: 'Notify me', move: 'Move to cart', off: '% off' };
    const sn = M.stockNote(p, hi);
    return {
      isRow: size === 'row', isCard: size !== 'row', isWish: mode === 'wish',
      t: T,
      p: { href: p.href, name: p.name, title: hi ? p.hi : p.name, catShort: M.CATS.find((c) => c.key === p.cat).short, priceS: M.fmt(p.price), mrpS: M.fmt(p.mrp), offS: M.off(p) + T.off, ratingS: p.rating.toFixed(1), reviewsS: '(' + p.reviews + ')', intentS: p.intent },
      titleSize: size === 'compact' || mob ? '16px' : '19px',
      img: M.img(React, p, 'main', 'c' + this.uid), img2: mob ? null : M.img(React, p, 'alt', 'c' + this.uid),
      img2op: h ? 1 : 0, lift: h ? 'translateY(-4px)' : 'none', shadow: h ? '0 18px 36px -18px rgba(14,59,48,.35)' : 'none', ring: h ? 'inset 0 0 0 1px rgba(184,146,58,.7)' : 'inset 0 0 0 1px rgba(184,146,58,0)',
      oosFilter: oos ? 'grayscale(.5) opacity(.75)' : 'none',
      badges,
      wished, heartIcon: wished ? ic.heartF : ic.heart, heartColor: wished ? '#A8322D' : '#164E3F', wishAria: wished ? 'Remove from wishlist' : 'Save to wishlist',
      showBar: !mob && mode === 'shop' && size !== 'row', barY: h || ph !== 'idle' ? 'translateY(0)' : 'translateY(14px)', barOp: h || ph !== 'idle' ? 1 : 0, barPe: h ? 'auto' : 'none',
      showPlus: mob && mode === 'shop' && !oos,
      hasSizes: !!p.sizes && ph === 'idle' && !oos,
      sizes: (p.sizes || []).map((k) => ({ k, pick: () => this.doAdd(k) })),
      addLabel: oos ? T.notify : ph === 'loading' ? T.adding : ph === 'added' ? T.added : T.add,
      addIcon: ph === 'added' ? ic.check : oos ? ic.bell : ic.bag, addDisabled: ph === 'loading',
      addAria: 'Add ' + p.name + ' to cart', plusIcon: ph === 'added' ? ic.check : ic.plus, rowIcon: ph === 'added' ? ic.check : ic.plus, starIcon: ic.starF, trashIcon: ic.trash,
      hasStock: !!sn, stockNote: sn,
      enter: () => this.setState({ h: true }), leave: () => this.setState({ h: false }),
      imgRef: (el) => { this.imgEl = el; },
      heartRef: (el) => { this.heartEl = el; },
      wish: (e) => { e.preventDefault(); const now = M.store.wishToggle(p.id); if (now) { M.fx.burst(this.heartEl); M.ui.toast('Saved to wishlist', { tone: 'ok', action: 'View', href: 'Wishlist.dc.html' }); } },
      add: () => { if (oos) { M.ui.toast("We'll message you on WhatsApp when it's back", { tone: 'info' }); return; } if (p.sizes) { M.ui.emit('quick', { pid: p.id }); return; } this.doAdd(null); },
      addMob: () => { if (p.sizes) M.ui.emit('quick', { pid: p.id }); else this.doAdd(null); },
      moveToCart: () => { if (p.sizes) { M.ui.emit('quick', { pid: p.id, fromWish: true }); return; } M.store.add(p.id, {}); M.fx.fly(this.imgEl); M.store.wishToggle(p.id); M.ui.toast(p.name + ' moved to cart', { tone: 'ok', action: 'View cart', act: 'cart' }); },
      removeWish: () => { M.store.wishToggle(p.id); M.ui.toast('Removed from wishlist', { tone: 'info', action: 'Undo', undoWish: p.id }); }
    };
  }
}
</script>
</body>
</html>
